name: Publish Talia download site

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: node --test tests/download-site.test.cjs tests/deploy-pages-branch.test.cjs
      - run: npm run build:download-site
        env:
          GH_TOKEN: ${{ github.token }}
          TALIA_RELEASE_REPOSITORY: Talia-Orchestrator/talia-store
      - name: Publish static branch and request Pages build
        run: node scripts/deploy-pages-branch.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
